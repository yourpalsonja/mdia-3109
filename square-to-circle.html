<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Square to Circle Transform</title>
        <style>
            .shape {
                width: 100px; /* Change size here */
                height: 100px; /* Change size here */
                background: red; /* Initial color */
                border-radius: 0; /* Square shape */
                transition:
                    border-radius 0.3s,
                    /* Duration of shape change */ background 0.3s,
                    /* Duration of color change */ transform 0.3s; /* Duration of transform (if needed) */
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 50px auto;
            }

            .shape.clicked {
                /* Toggled state */
                border-radius: 50%; /* Circle shape */
                background: black; /* New color */
                /* You can add transform here, e.g. scale(1.1) for a pop effect */
                /* transform: scale(1.1); */
            }
        </style>
    </head>
    <body>
        <div class="shape"></div>
        <script>
            // Toggle the 'clicked' class on click
            document
                .querySelector(".shape")
                .addEventListener("click", function () {
                    this.classList.toggle("clicked");
                });
        </script>
    </body>
</html>
