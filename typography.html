    <body>
        <article>
            <h1>The Web Was Built on Typography</h1>

            <p>
                Before images, animation, and branding, the web was designed to
                share written knowledge, with typography as the interface.
            </p>

            <h2>Why Typography Matters</h2>

            <p>
                Good typography respects the reader, clarifies structure, and
                creates rhythm.
            </p>

            <blockquote>

            </blockquote>
        </article>
