<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simple animation</title>
        <link href="styles.css" rel="stylesheet" />
    </head>
    <body>
        <div class="cloud"></div>
        <div class="sun" data-rise></div>
        <div class="horizon"></div>
        <script>
            let horizon = document.querySelector(".horizon");
            horizon.addEventListener("click", function () {
                document.querySelector(".sun").classList.toggle("sunrise");
            });
        </script>
    </body>
</html>
